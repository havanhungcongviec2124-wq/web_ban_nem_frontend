<!doctype html>
<html lang="vi" oncontextmenu="return false">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/leaf.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Nếp Nem · Gói vị quê. Mở sum vầy.</title>
    <meta name="description" content="Nem chua thơm lá, chua dịu vừa miệng. Chọn chút tỏi, chút ớt theo ý — để mỗi cuộc gặp đều thêm đậm đà." />
    <script>
      // Chặn chuột phải / phím tắt xem mã nguồn ngay từ đầu, trước khi bundle JS tải xong.
      (function () {
        // Link cũ dạng /#/products -> /products (chạy trước khi router khởi tạo)
        if (location.hash.indexOf('#/') === 0) {
          history.replaceState(null, '', location.hash.slice(1));
        }
        var stop = function (e) { e.preventDefault(); e.stopPropagation(); return false; };
        document.addEventListener('contextmenu', stop, true);
        document.addEventListener('keydown', function (e) {
          var k = String(e.key || '').toLowerCase();
          if (k === 'f12' || k === 'contextmenu' || k === 'apps') return stop(e);
          if (e.shiftKey && k === 'f10') return stop(e);
          if (!(e.ctrlKey || e.metaKey)) return true;
          if ((e.shiftKey || e.altKey) && ['i', 'j', 'c', 'k'].indexOf(k) > -1) return stop(e);
          if (k === 'u' || k === 's') return stop(e);
          return true;
        }, true);
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-nep-cream text-nep-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
